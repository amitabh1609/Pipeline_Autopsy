# Render Blueprint — creates two web services from the same image.
# After first deploy: set OPENAI_API_KEY + LLM_MODE=openai in the Render dashboard if needed.
#
# Note: each service has its own ephemeral filesystem — SQLite traces are not shared between API and UI.
# For shared persistence, use a VM + docker compose or attach Render disks (paid) and point both at one DB path.
version: "1"
services:
  - type: web
    name: traceback-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: LLM_MODE
        value: mock
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false

  # Streamlit "/" often fails HTTP health checks (redirect/HTML). Use Streamlit's core health route.
  - type: web
    name: traceback-ui
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/start-ui.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: LLM_MODE
        value: mock
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
