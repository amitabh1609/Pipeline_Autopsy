# Fly.io — API only (single process). Change `app` after `fly apps create`.
# Deploy: `fly deploy`
# Set secrets: `fly secrets set OPENAI_API_KEY=sk-...` and `fly secrets set LLM_MODE=openai`
#
# For Streamlit on Fly, create a second app with `fly launch` and CMD start-ui.sh (or run UI locally).

app = "failure-forensics-api"
primary_region = "iad"

[build]

[env]
  LLM_MODE = "mock"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
